# ============================================================
# OhMyUniversity! - Canteen
# Base configuration - shared across all profiles.
# ============================================================

spring:
  profiles:
    default: dev
  application:
    name: ohmyuniversity-canteen
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    org.ohmyopensource: INFO